[project]
name = "dprsc-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of Differentially Private Range Subgraph Counting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "marimo>=0.17,<1",
    "matplotlib>=3.10,<4",
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "pytest>=8.4,<10",
    "z3-solver==4.15.3.0",
]

[tool.pytest.ini_options]
testpaths = ["repro"]
addopts = "-ra"
